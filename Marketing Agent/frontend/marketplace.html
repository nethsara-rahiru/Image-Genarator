<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Marketplace – MarketingAgent</title>

  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="index.html"
          ><span class="brand-mark">M</span>MarketingAgent</a
        >
        <nav class="nav" aria-label="Main">
          <a class="link" href="index.html">Home</a
          ><a class="link" href="marketplace.html">Marketplace</a
          ><a class="link" href="index.html#how">How it works</a>
        </nav>
        <div class="actions" id="navActions"></div>
      </div>
    </header>
    <main>
      <section class="block">
        <div class="wrap">
          <div class="section-head">
            <h2>Marketplace</h2>
            <div class="tools">
              <label
                for="search"
                class="hint"
                style="position: absolute; left: -9999px"

              ><input
                type="search"
                id="search"
                placeholder="Search tea, batik, Kandy…"
              />

          </div>
          <div

            id="chips"
            role="group"
            aria-label="Filter by category"
            style="margin-bottom: 1.2rem"
          ></div>
          <div class="grid" id="grid" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <footer>
      <div class="wrap">
        MarketingAgent · Team Creatives #13 · Theme 01: Solutions for current
        SME problems
      </div>
    </footer>
    <script src="js/api.js"></script>
