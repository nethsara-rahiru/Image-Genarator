<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Log in – MarketingAgent</title></head><body>
<header class="site-header"><div class="wrap"><a class="brand" href="index.html"><span class="brand-mark">M</span>MarketingAgent</a><nav class="nav" aria-label="Main"><a class="link" href="index.html">Home</a><a class="link" href="index.html#marketplace">Marketplace</a><a class="link" href="index.html#how">How it works</a></nav><div class="actions" id="navActions"></div></div></header>
<main class="auth"><div class="panel">
  <h1>Log in</h1><p class="sub">Welcome back. Pick up where you left off.</p>
  <form id="loginForm" novalidate>
    <div class="form-msg" role="alert"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><div class="err" data-err="email"></div></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><div class="err" data-err="password"></div></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="alt">New here? <a href="signup.html">Create an account</a></p>
</div></main>
<script src="js/api.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
