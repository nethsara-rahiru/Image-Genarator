<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Sign up – MarketingAgent</title>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="index.html"
          ><span class="brand-mark">M</span>MarketingAgent</a
        >
        <nav class="nav" aria-label="Main">
          <a class="link" href="index.html">Home</a
          ><a class="link" href="index.html#marketplace">Marketplace</a
          ><a class="link" href="index.html#how">How it works</a>
        </nav>
        <div class="actions" id="navActions"></div>
      </div>
    </header>
    <main class="auth">
      <div class="panel">
        <h1>Create your account</h1>
        <p class="sub">It takes under a minute.</p>
        <form id="signupForm" novalidate>
          <div class="form-msg" role="alert"></div>
          <div class="field">
            <label for="name">Full name</label
            ><input id="name" name="name" autocomplete="name" />
            <div class="err" data-err="name"></div>
          </div>
          <div class="field">
            <label for="email">Email</label
            ><input id="email" name="email" type="email" autocomplete="email" />
            <div class="err" data-err="email"></div>
          </div>
          <div class="field">
            <label for="role">I am a</label
            ><select id="role" name="role">
              <option value="owner">Business owner</option>
              <option value="customer">Customer</option>
              <option value="b2b">Business buying from businesses</option>
            </select>
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
            />
            <div class="err" data-err="password"></div>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label
            ><input
              id="confirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
            />
            <div class="err" data-err="confirm"></div>
          </div>
          <button class="btn btn-primary btn-block" type="submit">
            Create account
          </button>
        </form>
        <p class="alt">Already registered? <a href="login.html">Log in</a></p>
      </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
