<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gemini Agent · Administration</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#overview"
        ><span class="mark">✦</span> GEMINI <small>AGENT / CONTROL</small></a
      >
      <nav aria-label="Main navigation" id="nav"></nav>
      <div class="aside-bottom">
        <span id="connection">Connecting…</span
        ><button id="logout" class="quiet">Sign out</button>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <span class="eyebrow">AUTOMATION PLATFORM</span>
          <h1 id="title">Overview</h1>
        </div>
        <span class="badge">PRIVATE WORKSPACE</span>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="content" aria-live="polite"></section>
      <footer>
        One job at a time · Isolated account profiles · Live integrations
        require validation
      </footer>
    </main>
    <dialog id="login">
      <form id="login-form">
        <span class="mark">✦</span>
        <h2>Welcome back</h2>
        <p>Sign in to your private automation workspace.</p>
        <label
          >Administrator<input
            name="username"
            required
            autocomplete="username" /></label
        ><label
          >Password<input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        /></label>
        <p id="login-error" role="alert"></p>
        <button>Sign in securely</button>
      </form>
    </dialog>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
