<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Secure Google login</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body class="viewer-body">
    <div class="row between">
      <div>
        <h2>Temporary Google login browser</h2>
        <p class="muted">
          Click the browser and type directly. Tab, Enter and paste are
          supported. Complete Google sign-in, open Gemini, then verify.
        </p>
      </div>
      <div class="row">
        <button id="reconnect" class="quiet">Reconnect viewer</button
        ><button id="open-gemini" class="quiet">Open Gemini</button
        ><button id="finish">Verify & finish</button>
      </div>
    </div>
    <p id="expiry" class="muted" aria-live="off"></p>
    <p id="status" role="status">Connecting…</p>
    <p id="verification-status" role="status"></p>
    <canvas
      id="screen"
      width="1280"
      height="800"
      tabindex="0"
      aria-label="Interactive remote Google browser. Use Tab and Enter to navigate."
    ></canvas>
    <script type="module" src="/js/viewer.js"></script>
  </body>
</html>
