name: Local native browser CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prepare verified Caddy for LAN HTTPS integration
        run: node scripts/prepare-lan-test.js
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool openbox imagemagick x11-utils dbus-daemon
      - if: runner.os == 'Linux'
        run: bash -n scripts/install-ubuntu.sh
      - if: runner.os == 'Linux'
        run: npm test
        env:
          RUN_NATIVE_TESTS: "1"
          TEST_CHROME: /usr/bin/google-chrome
      - if: runner.os != 'Linux'
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-fixture-previews-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
  background:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production background workspace
        run: docker build --build-arg BROWSER_UID=1001 --build-arg BROWSER_GID=1001 -f container/Dockerfile -t local-browser-ci .
      - name: Verify non-root sandboxed Chromium and private capture
        run: docker run --rm --init --user 1001:1001 --shm-size=1g --tmpfs /tmp:rw,nosuid,mode=1777,size=1g --security-opt seccomp=container/seccomp.json local-browser-ci node scripts/container-smoke.js
  marketing-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8.0
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix 'Marketing Agent/backend'
      - run: npm test --prefix 'Marketing Agent/backend'
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          TEST_CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-agent-previews
          path: Marketing Agent/backend/test-results/
          if-no-files-found: ignore
